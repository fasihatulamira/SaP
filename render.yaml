# Render Blueprint — GIS Info (Supabase / PostgreSQL branch)
# Deploy from branch `supabase` so production (main + Aiven MySQL) is unchanged.
# Dashboard: New → Blueprint → connect repo → select branch `supabase`
# Expected URL: https://gis-info-supabase.onrender.com

services:
  - type: web
    name: gis-info-supabase
    runtime: python
    plan: free
    branch: supabase
    buildCommand: pip install -r requirements.txt
    startCommand: python run_production.py
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: FLASK_DEBUG
        value: "False"
      - key: AUTH_ENABLED
        value: "True"
      - key: RATE_LIMIT_ENABLED
        value: "True"
      - key: RATE_LIMIT_DEFAULT
        value: 120 per minute
      - key: SESSION_LIFETIME_MINUTES
        value: "30"
      - key: SECRET_KEY
        generateValue: true
      - key: AUTH_ADMIN_USERNAME
        value: admin
      - key: AUTH_ADMIN_PASSWORD
        sync: false
      - key: AUTH_USER_USERNAME
        value: user
      - key: AUTH_USER_PASSWORD
        sync: false
      # Supabase → Project Settings → Database → Connection string (URI)
      # Use "Session pooler" or "Transaction pooler" URI; append ?sslmode=require if needed
      - key: DATABASE_URL
        sync: false
