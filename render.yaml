# Render Blueprint — SaP LISTMAP web service
# Dashboard: New → Blueprint → connect this repo
# You still need a MySQL private service (see DEPLOYMENT.md).

services:
  - type: web
    name: sap-listmap
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_production.py
    healthCheckPath: /login
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: FLASK_DEBUG
        value: "False"
      - key: AUTH_ENABLED
        value: "True"
      - key: RATE_LIMIT_ENABLED
        value: "True"
      - key: RATE_LIMIT_DEFAULT
        value: 120 per minute
      - key: SESSION_LIFETIME_MINUTES
        value: "30"
      - key: SECRET_KEY
        generateValue: true
      - key: AUTH_ADMIN_USERNAME
        value: admin
      - key: AUTH_ADMIN_PASSWORD
        sync: false
      - key: AUTH_USER_USERNAME
        value: user
      - key: AUTH_USER_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: listmap
