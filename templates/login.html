<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — GIS Info</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-theme login-page">
    <div class="login-card glass-card">
        <div class="login-brand">
            <div class="brand-icon"><i class="fas fa-layer-group"></i></div>
            <h1>GIS Info</h1>
            <p>Confidential data portal — sign in to continue</p>
        </div>

        {% if error %}
        <div class="login-error" role="alert">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="post" class="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="search-input" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="search-input" autocomplete="current-password" required>

            <button type="submit" class="btn btn-primary login-submit">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
    </div>
</body>
</html>
